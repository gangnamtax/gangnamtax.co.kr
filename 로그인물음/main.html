<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세무회계강남 | 국세청 경력 세무사 · 양도세 상속증여 전문</title>
    <style>
        /* 기본 여백 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 전체 배경 및 폰트 설정 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* 상단 헤더 영역 */
        .header {
            background: #ffffff;
            padding: clamp(10px, 1.5vw, 20px) 5%;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { 
            font-size: clamp(15px, 2vw, 20px); 
            font-weight: 800; 
            color: #1e3a8a; 
        }

        /* 상단 우측 인증 버튼 그룹 (창에 맞춰 확실하게 작아지도록 수정) */
        .auth-buttons {
            display: flex;
            gap: clamp(4px, 0.8vw, 10px);
        }

        .auth-btn {
            padding: clamp(4px, 0.8vw, 8px) clamp(8px, 1.2vw, 16px);
            font-size: clamp(10px, 1.2vw, 14px); /* 창이 줄면 버튼 글씨도 같이 작아짐 */
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .btn-login {
            background: transparent;
            color: #2563eb;
            border: 1px solid #2563eb;
        }

        .btn-login:hover {
            background: #eff6ff;
        }

        .btn-signup {
            background: #2563eb;
            color: #ffffff;
            border: 1px solid #2563eb;
        }

        .btn-signup:hover {
            background: #1d4ed8;
        }
        
        /* 전체 콘텐츠를 감싸는 메인 틀 */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        /* 상단 제목 영역 */
        .intro-text {
            text-align: center;
            margin-bottom: 40px;
        }
        .intro-text h1 { 
            font-size: clamp(22px, 3.5vw, 36px); 
            font-weight: 800; 
            margin-bottom: 10px; 
            color: #0f172a; 
        }
        .intro-text p { 
            font-size: clamp(12px, 1.4vw, 16px); 
            color: #64748b; 
        }

        /* 카드 3개를 무조건 가로로 나란히 고정 */
        .card-wrapper {
            display: flex;
            gap: 2%; 
            justify-content: space-between;
            width: 100%;
        }

        /* 개별 카드 디자인 */
        .card {
            flex: 1;                   
            min-width: 0;              
            background: #ffffff;
            padding: clamp(15px, 2.5vw, 28px) clamp(12px, 2vw, 22px); 
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;    
            justify-content: space-between; 
            height: clamp(180px, 22vw, 220px); 
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        /* 마우스 올렸을 때 효과 */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border-color: #cbd5e1;
        }

        .card h3 { 
            font-size: clamp(12px, 1.6vw, 18px); 
            font-weight: 700; 
            color: #1e3a8a; 
            margin-bottom: 6px; 
            white-space: nowrap;  
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card p { 
            font-size: clamp(10px, 1.1vw, 13px); 
            color: #64748b; 
            margin-bottom: 10px; 
            line-height: 1.3;
        }

        .card-link { 
            font-size: clamp(11px, 1.2vw, 14px); 
            font-weight: 600; 
            color: #2563eb; 
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 상단 헤더 영역 -->
    <div class="header">
        <div class="logo">세무회계강남</div>
        <div class="auth-buttons">
            <!-- 양도세계산기 폴더 안의 로그인 페이지 경로로 연결 -->
            <a href="양도세계산기/main.html" class="auth-btn btn-login">로그인</a>
            <a href="양도세계산기/main.html" class="auth-btn btn-signup">회원가입</a>
        </div>
    </div>

    <!-- 본문 내용 영역 -->
    <div class="container">
        
        <!-- 페이지 상단 제목과 설명 -->
        <div class="intro-text">
            <h1>세무회계강남 서비스 포털</h1>
            <p>필요한 전문 서비스를 선택해 주세요.</p>
        </div>

        <!-- 카드 메뉴 목록 시작 (누르면 양도세계산기 폴더의 로그인 페이지로 이동) -->
        <div class="card-wrapper">
            
            <!-- 1번 카드: 양도세 계산기 -->
            <a href="양도세계산기/main.html" class="card">
                <div>
                    <h3>📊 양도소득세 계산기</h3>
                    <p>부동산 양도 시 발생하는 예상 세액을 빠르고 정확하게 시뮬레이션해 보세요.</p>
                </div>
                <span class="card-link">이용하기 &rarr;</span>
            </a>

            <!-- 2번 카드: 세무 기장 및 상담 -->
            <a href="양도세계산기/main.html" class="card">
                <div>
                    <h3>🏢 세무 기장 및 상담</h3>
                    <p>법인 및 개인 사업자를 위한 체계적인 세무 기장 및 절세 컨설팅</p>
                </div>
                <span class="card-link">이용하기 &rarr;</span>
            </a>

            <!-- 3번 카드: 상속·증여 컨설팅 -->
            <a href="양도세계산기/main.html" class="card">
                <div>
                    <h3>🤝 상속·증여 컨설팅</h3>
                    <p>사전 증여부터 상속세 신고까지 전문가의 1:1 맞춤형 플랜</p>
                </div>
                <span class="card-link">이용하기 &rarr;</span>
            </a>

        </div> <!-- 카드 목록 끝 -->

    </div>

</body>
</html>
